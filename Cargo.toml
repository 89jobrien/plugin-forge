[package]
name = "plugin-forge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Build and verify agent harness plugins"
repository = "https://github.com/89jobrien/plugin-forge"

[lib]
name = "plugin_forge"
path = "src/lib.rs"

[[bin]]
name = "plugin-forge"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
